<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8c9db"><title>Monta connaît-il Mariem ?</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#254635;font-family:'DM Sans',sans-serif;min-height:100vh}body:before,body:after{content:'';position:fixed;width:450px;height:450px;border-radius:50%;filter:blur(75px);opacity:.5;z-index:-1}body:before{background:#ffc9dc;left:-250px;top:120px}body:after{background:#cde6b0;right:-250px;bottom:0}header{max-width:1050px;margin:auto;padding:30px;display:flex;justify-content:space-between;align-items:center}.brand{font:italic 35px 'Playfair Display',serif}.brand span{color:#e17f9f}.pill{border:1px solid #b8c9ab;border-radius:30px;padding:10px 15px;font-size:10px;letter-spacing:2px}main{max-width:710px;padding:0 24px;margin:25px auto 60px;text-align:center}.flower{font-size:65px;background:#f7c8d9;border-radius:44% 56% 58% 42%;width:115px;height:115px;display:grid;place-items:center;margin:20px auto 30px;animation:bob 5s ease-in-out infinite}.eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase}h1{font:600 clamp(38px,6vw,64px)/1.13 'Playfair Display',serif;letter-spacing:-1.5px;margin:18px 0 25px}em{color:#dc739c}h2{font:600 30px/1.3 'Playfair Display',serif}p{line-height:1.7;color:#657561}.lede{max-width:460px;margin:0 auto 25px}.badge{background:#e5efd8;border-radius:30px;padding:8px 13px;font-size:12px;display:inline-block;margin:4px}button,.button{font:600 15px 'DM Sans',sans-serif;background:#254635;color:white;border:0;border-radius:35px;padding:17px 25px;text-decoration:none;display:inline-block;cursor:pointer;transition:transform .2s}button:hover,.button:hover{transform:translateY(-3px)}button:disabled{opacity:.4;cursor:default}.secondary{border:1px solid #bccbb4;background:transparent;color:#254635;margin:12px}.card{background:white;border:1px solid #e2e8dc;padding:30px;border-radius:27px;box-shadow:0 20px 50px #25463508;text-align:left;animation:appear .4s ease}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}.option{padding:20px;border-radius:15px;border:1px solid #d9e3d1;background:white;color:#254635;text-align:left}.option[aria-pressed=true]{background:#dfedcf;border:2px solid #84a56b;padding:19px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:6px;background:#e8eede;border-radius:10px;overflow:hidden;margin:15px 0 30px}.progress div{height:100%;background:#ef8eaf;transition:width .3s}.muted{font-size:12px;color:#76816e}.note{font-size:13px;background:#f3f7eb;padding:15px;border-radius:14px}input{width:100%;padding:15px;border:1px solid #cfdbc6;border-radius:12px;margin:12px 0 22px;font:15px 'DM Sans',sans-serif}.score{font:600 75px 'Playfair Display',serif;color:#dd7d9f;text-align:center}.center{text-align:center}footer{font-size:11px;color:#7b8973;padding:25px;text-align:center}.spark{position:fixed;right:12%;top:33%;font-size:70px;color:#91ad7d;animation:bob 6s infinite;z-index:-1}.answer{border-top:1px solid #e2e8dc;padding:13px 0}.confetti{position:fixed;top:-30px;pointer-events:none;animation:fall 3s linear forwards;font-size:22px}@keyframes bob{50%{transform:translateY(-12px) rotate(9deg)}}@keyframes appear{from{opacity:0;transform:translateY(15px)}}@keyframes fall{to{transform:translateY(110vh) rotate(350deg)}}@media(max-width:600px){header{padding:22px}.pill{font-size:8px;letter-spacing:1px}.options{grid-template-columns:1fr}.card{padding:23px}main{margin-top:5px}.spark{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><header><div class="brand">m <span>♡</span> m</div><span class="pill">LE PETIT TEST D’AMOUR</span></header><div class="spark" aria-hidden="true">♡</div><main id="app"></main><footer>Fait pour Mariem & Monta · avec un peu de rose et beaucoup d’amour ♡</footer><script>
const questions=[['Quelle est ma couleur préférée ?',['Rose 🌸','Vert 🌿','Bleu 🦋','Noir 🖤']],['Quel repas me fait le plus plaisir ?',['Pizza 🍕','Couscous 🥘','Sushi 🍣','Pâtes 🍝']],['Ma sortie idéale avec toi ?',['Un dîner romantique 🕯️','Une balade à la mer 🌊','Une soirée cinéma 🎬','Une aventure surprise ✈️']],['Quelle attention me touche le plus ?',['Un message tendre 💌','Des fleurs 🌷','Du temps ensemble 🤍','Une surprise 🎁']],['Quand je suis triste, je préfère…',['Un câlin 🫂','Que tu m’écoutes 💬','Un peu de calme 🌙','Que tu me fasses rire 😊']],['Je suis plutôt…',['Du matin ☀️','Du soir 🌙','Ça dépend ✨','Une sieste 😴']],['Quel cadeau choisirais-je ?',['Un bijou 💍','Un voyage 🧳','Un livre 📖','Une journée à deux 💞']],['Ma gourmandise préférée ?',['Chocolat 🍫','Glace 🍦','Gâteau 🍰','Fruits 🍓']],['Un week-end à deux…',['La mer 🏖️','La montagne 🌄','Une jolie ville 🏙️','À la maison 🏡']],['Ce qui compte le plus pour moi ?',['La confiance 🤍','La complicité ✨','La tendresse 🌷','La communication 💬']]];
const app=document.getElementById('app');let config=null,ownerEmail='',mode='setup',step=0,answers=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const encode=x=>btoa(unescape(encodeURIComponent(JSON.stringify(x))));
const decode=x=>JSON.parse(decodeURIComponent(escape(atob(x))));
async function deliver(subject,message){const r=await fetch('https://formsubmit.co/ajax/'+encodeURIComponent(config.e),{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({_subject:subject,message,_template:'table'})});const d=await r.json();if(!r.ok||!(d.success===true||d.success==='true'))throw Error('Envoi indisponible');return d}
function home(){app.innerHTML='<div class="flower">♡</div><div class="eyebrow">Mariem + Monta · le challenge</div><h1>On va voir si <em>Monta</em> connaît bien <em>Mariem</em> ou non.</h1><p class="lede">Les petits détails, les grandes attentions…<br>Est-ce que tu connais vraiment ton amoureuse ?</p><span class="badge">10 questions</span><span class="badge">2 minutes</span><span class="badge">100 % vous deux</span><br><br>'+(!config?'<label for="email">Ton e-mail pour recevoir le résultat</label><input id="email" type="email" required placeholder="Ton adresse e-mail">':'')+'<button id="start">'+(config?'Monta, à toi de jouer →':'Mariem, prépare ton quiz →')+'</button><p class="muted">'+(config?'Ton score et tes réponses seront transmis à Mariem via FormSubmit.':'Choisis tes vraies réponses, puis partage le lien avec Monta.')+'</p>';document.getElementById('start').onclick=()=>{if(!config){const e=document.getElementById('email');if(!e.reportValidity())return;ownerEmail=e.value.trim()}mode=config?'play':'setup';step=0;answers=[];question()}}
function question(){const [q,o]=questions[step];app.innerHTML='<div class="eyebrow">'+(mode==='setup'?'Les secrets de Mariem':'À toi de jouer, Monta')+'</div><h2>'+(mode==='setup'?'Qu’est-ce qui te ressemble ?':'Tu la connais par cœur ?')+'</h2><section class="card"><div class="row"><span class="muted">QUESTION '+(step+1)+' / 10</span><span>♡</span></div><div class="progress"><div style="width:'+step*10+'%"></div></div><h2>'+esc(q)+'</h2><p class="muted">'+(mode==='setup'?'Choisis ta vraie réponse.':'Une seule réponse. Fais confiance à ton instinct.')+'</p><div class="options">'+o.map((v,i)=>'<button class="option" data-choice="'+i+'" aria-pressed="'+(answers[step]===i)+'">'+String.fromCharCode(65+i)+' · '+esc(v)+'</button>').join('')+'</div><div class="row"><button class="secondary" id="back" '+(!step?'disabled':'')+'>← Retour</button><button id="next" '+(answers[step]===undefined?'disabled':'')+'>'+(step===9?'Terminer ♡':'Suivant →')+'</button></div></section>';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.choice);question()});document.getElementById('back').onclick=()=>{step--;question()};document.getElementById('next').onclick=()=>{if(step<9){step++;question()}else if(mode==='setup')share();else result()}}
function share(){config={v:1,a:answers.slice(),e:ownerEmail};const link=location.href.split('#')[0]+'#quiz='+encode(config);app.innerHTML='<div class="flower">💌</div><h1>Le quiz est <em>prêt.</em></h1><p class="lede">Active les e-mails, puis envoie ce lien à Monta. Il pourra jouer depuis son téléphone.</p><section class="card"><label for="link">Le lien de ton quiz</label><input id="link" readonly value="'+esc(link)+'"><button id="copy">Copier le lien ♡</button><p id="copy-status" role="status"></p><p class="note">Active une fois FormSubmit : clique ci-dessous, puis confirme le message reçu dans ta boîte mail ou tes spams. Les résultats seront transmis à ce service pour être envoyés à '+esc(ownerEmail)+'.</p><button id="activate" class="secondary">Activer les e-mails 💌</button><p id="email-status" role="status"></p><p class="muted">Le lien contient ton adresse et les bonnes réponses, sans protection contre leur consultation. Partage-le uniquement avec Monta.</p></section><button class="secondary" id="modify">Modifier mes réponses</button>';document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(link);document.getElementById('copy-status').textContent='Lien copié !'}catch{document.getElementById('link').select();document.getElementById('copy-status').textContent='Copie le lien sélectionné.'}};document.getElementById('activate').onclick=async()=>{const b=document.getElementById('activate');b.disabled=true;document.getElementById('email-status').textContent='Demande en cours…';try{await deliver('Activation du quiz Mariem & Monta','Confirme cette adresse pour recevoir les résultats du quiz.');document.getElementById('email-status').textContent='Vérifie ta boîte mail et confirme ton adresse ♡'}catch{document.getElementById('email-status').textContent='Envoi indisponible. Réessaie.';b.disabled=false}};document.getElementById('modify').onclick=()=>{config=null;step=0;mode='setup';question()}}
function result(){const score=answers.reduce((s,a,i)=>s+Number(a===config.a[i]),0);const title=score>=8?'Monta, tu connais Mariem par cœur !':score>=5?'Une jolie complicité !':'Encore des secrets à découvrir ensemble ♡';const detail=questions.map(([q,o],i)=>(i+1)+'. '+q+'\nMonta : '+o[answers[i]]+'\nMariem : '+o[config.a[i]]).join('\n\n');const body='Coucou Mariem !\nMonta a terminé ton quiz.\nScore : '+score+'/10 ('+score*10+' %)\n'+title+'\n\n'+detail;const mail='mailto:'+encodeURIComponent(config.e)+'?subject='+encodeURIComponent('Monta a joué : '+score+'/10 ♡')+'&body='+encodeURIComponent(body);app.innerHTML='<div class="flower">💞</div><div class="eyebrow">Le verdict de l’amour</div><h1>Chaque détail nous <em>rapproche.</em></h1><section class="card center"><div class="score">'+score+' / 10</div><h2>'+title+'</h2><p class="note" id="sent" role="status">Transmission du résultat à Mariem…</p><a class="button" href="'+esc(mail)+'">Envoyer aussi depuis ma messagerie 💌</a><p class="muted">Ce bouton ouvre un brouillon ; appuie ensuite sur Envoyer.</p><details style="text-align:left"><summary>Voir mes réponses</summary>'+questions.map(([q,o],i)=>'<div class="answer"><strong>'+esc(q)+'</strong><p>Ta réponse : '+esc(o[answers[i]])+'<br>Mariem : '+esc(o[config.a[i]])+(answers[i]===config.a[i]?' ✓':' ♡')+'</p></div>').join('')+'</details></section><button class="secondary" id="again">Rejouer</button>';deliver('Monta a terminé le quiz : '+score+'/10 ♡',body).then(()=>{document.getElementById('sent').textContent='Résultat transmis au service e-mail. Mariem le recevra si elle a confirmé son adresse.'}).catch(()=>{document.getElementById('sent').textContent='L’envoi automatique a échoué. Utilise le bouton de messagerie ci-dessous.'});document.getElementById('again').onclick=()=>{step=0;answers=[];question()};if(!matchMedia('(prefers-reduced-motion: reduce)').matches)for(let i=0;i<22;i++){const e=document.createElement('span');e.className='confetti';e.textContent=i%2?'♡':'✦';e.style.left=Math.random()*100+'vw';e.style.color=i%2?'#e787a8':'#91ad7d';e.style.animationDelay=Math.random()+'s';document.body.append(e);setTimeout(()=>e.remove(),4500)}}
try{if(location.hash.startsWith('#quiz=')){const c=decode(location.hash.slice(6));if(c.v!==1||typeof c.e!=='string'||! /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.e)||!Array.isArray(c.a)||c.a.length!==10||!c.a.every(a=>Number.isInteger(a)&&a>=0&&a<4))throw Error('Lien invalide');config=c}home()}catch{app.innerHTML='<h1>Ce lien est incomplet.</h1><p>Demande à Mariem de te renvoyer le lien.</p><a class="button" href="./">Préparer un quiz</a>'}
</script></body></html>
